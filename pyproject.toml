[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niflow"
version = "0.2.0"
description = "Declarative NiFi flows in Python — pull, edit, push (NiFi 1.x and 2.x)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NiFlow" }]
keywords = ["nifi", "nipyapi", "dataflow", "etl"]
dependencies = [
    "nipyapi>=1.0",
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
niflow = "niflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["niflow"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running NiFi instance (deselect with '-m \"not integration\"')",
]
