# Local single-user NiFi instances for developing and testing NiFlow.
#
#   docker compose up -d                 -> NiFi 2.7.2  https://localhost:8443/nifi
#                                           + Registry 2.7.2 http://localhost:18080/nifi-registry
#   docker compose --profile v1 up -d    -> NiFi 1.24.0 https://localhost:8444/nifi
#                                           + Registry 1.24.0 http://localhost:18081/nifi-registry
#   docker compose --profile cluster up -d -> a TWO-NODE NiFi 1.24.0 cluster
#                                           http://localhost:8180 + :8181 (+ ZooKeeper)
#   docker compose --profile load up -d  -> NiFi 1.24.0 with a DELIBERATELY TINY
#                                           provenance repo https://localhost:8446
#
# NiFi logs in as admin / adminpassword123. The registries are unsecured HTTP
# (local dev only) and are reached from the NiFi containers by service name
# (http://registry:18080 / http://registry1:18080) when you add a registry client.
# NiFi logs stdout very chattily (a failing processor can loop at ERROR level),
# and Docker's json-file driver does not rotate by default — cap every service
# so a bad night can't fill the disk again.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
    compress: "true"

services:
  # NiFi 1.24.0 — mirrors the work environment (1.24/1.28 line). Opt-in via
  # the "v1" profile so the default `docker compose up` stays 2.x-only.
  nifi1:
    image: apache/nifi:1.24.0
    logging: *default-logging
    container_name: niflow-nifi1
    profiles: ["v1"]
    ports:
      - "8444:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      # 1.x validates the Host header; whitelist the host-mapped port.
      NIFI_WEB_PROXY_HOST: "localhost:8444"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "adminpassword123"
    volumes:
      - ./.nifi-data/in:/in
      - ./.nifi-data/out:/out
      # A CUSTOM NAR, which is the one thing a stock container cannot give us:
      # work runs its own processors, and niflow's rulebooks only know the
      # types Apache ships. `make custom-nar` builds one into .nifi-nars/;
      # NiFi 1.9+ hot-loads whatever it finds in ./extensions, and an empty
      # (or absent) directory is simply a NiFi with no extra types.
      - ./.nifi-nars:/opt/nifi/nifi-current/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://$$(hostname):8443/nifi-api/access/config || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # NiFi Registry paired with the 1.24 line (profile v1). Flow snapshots are
  # version-line sensitive, so each NiFi talks to a registry on its own version.
  registry1:
    image: apache/nifi-registry:1.24.0
    logging: *default-logging
    container_name: niflow-registry1
    profiles: ["v1"]
    ports:
      - "18081:18080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://$$(hostname):18080/nifi-registry-api/buckets || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------------------- load
  # NiFi with a deliberately TINY provenance repository (profile "load").
  #
  # Every provenance finding niflow acts on — the per-shard maxResults cap, the
  # time-window walk that replaced count escalation, "no events" meaning the
  # uuid aged out — was measured on a quiet container with one client and a
  # repository that never rolled over. Neither is true at work. This one rolls
  # over every 10 seconds and keeps one minute of history in 5 MB, so a test
  # can generate real volume, watch events age out underneath a query, and
  # restart the node to catch it re-indexing. Note NiFi only purges when the
  # repository ROLLS OVER, so events on an idle server outlive their retention
  # — ageing something out takes a trickle of traffic, not just patience.
  #
  # The image's start.sh does not map these properties to env vars, so they are
  # patched into nifi.properties before it runs. sed-then-start is safe: the
  # properties start.sh rewrites from the environment are a fixed list, and
  # none of them is a provenance one.
  nifi-load:
    image: apache/nifi:1.24.0
    logging: *default-logging
    container_name: niflow-nifi-load
    profiles: ["load"]
    ports:
      - "8446:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: "localhost:8446"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "adminpassword123"
      NIFI_JVM_HEAP_INIT: "1g"
      NIFI_JVM_HEAP_MAX: "2g"
    entrypoint:
      - /bin/bash
      - -c
      - |
        conf=/opt/nifi/nifi-current/conf/nifi.properties
        set_prop() { sed -i "s|^$$1=.*|$$1=$$2|" "$$conf"; }
        set_prop nifi.provenance.repository.max.storage.time "1 min"
        set_prop nifi.provenance.repository.max.storage.size "5 MB"
        set_prop nifi.provenance.repository.rollover.time "10 secs"
        set_prop nifi.provenance.repository.rollover.size "1 MB"
        set_prop nifi.provenance.repository.index.shard.size "1 MB"
        exec ../scripts/start.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://$$(hostname):8443/nifi-api/access/config || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ------------------------------------------------------------------ cluster
  # A real two-node NiFi cluster (profile "cluster"), which is the only way to
  # test primary-node-only scheduling, load-balanced connections actually
  # redistributing, and what niflow does when a node is disconnected.
  #
  # Why 1.24 and why plain HTTP: node-to-node communication has to be mutually
  # trusted, and a secured cluster means generating a cert per node plus a
  # shared truststore — real, but a lot of moving parts for a test fixture.
  # NiFi 1.x still allows `nifi.web.http.port`, so an unsecured cluster is two
  # env vars; NiFi 2.x removed plain HTTP, so this profile is 1.x only. That
  # is also the line work runs (1.24/1.28), which is the axis that matters.
  # niflow speaks to it anonymously — no password configured, no token call
  # (see TransportMixin.login).
  cluster-zk:
    image: zookeeper:3.9
    logging: *default-logging
    container_name: niflow-cluster-zk
    profiles: ["cluster"]
    hostname: cluster-zk
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,mntr,ruok"
      ZOO_ADMINSERVER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Both nodes are identical apart from their address and published port —
  # which is the point: a cluster has no "main" node, only an elected
  # coordinator and an elected primary, and niflow must not care which is which.
  cluster-n1:
    image: apache/nifi:1.24.0
    logging: *default-logging
    container_name: niflow-cluster-n1
    profiles: ["cluster"]
    hostname: cluster-n1
    depends_on:
      cluster-zk:
        condition: service_healthy
    ports:
      - "8180:8080"
    environment: &cluster-node-env
      NIFI_WEB_HTTP_PORT: "8080"
      # 1.x validates the Host header, and the host reaches the node through a
      # published port; whitelist both spellings it can arrive as.
      NIFI_WEB_PROXY_HOST: "localhost:8180,localhost:8181"
      NIFI_CLUSTER_IS_NODE: "true"
      NIFI_CLUSTER_NODE_PROTOCOL_PORT: "8082"
      NIFI_ZK_CONNECT_STRING: "cluster-zk:2181"
      # Non-obvious and fatal: a CLUSTERED 1.x node refuses to launch without
      # an explicit shared sensitive-properties key ("Clustered Configuration
      # Found: Shared Sensitive Properties Key required for cluster nodes"),
      # and every node must use the SAME one or they cannot read each other's
      # flow. Standalone nodes generate one per container, which is why this
      # only bites here.
      NIFI_SENSITIVE_PROPS_KEY: "niflow-cluster-sensitive-key"
      # A test fixture must not sit through the default 5-minute flow election.
      NIFI_ELECTION_MAX_WAIT: "20 sec"
      NIFI_ELECTION_MAX_CANDIDATES: "2"
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
    healthcheck:
      # /flow/cluster/summary answers only once this node has joined, so a
      # healthy container really does mean "clustered", not merely "listening".
      # Probe by $$(hostname): NiFi binds the web server to the container's own
      # name, not localhost (the same reason every other service here does).
      test: ["CMD-SHELL", "curl -s http://$$(hostname):8080/nifi-api/flow/cluster/summary | grep -q '\"connectedToCluster\":true'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  cluster-n2:
    image: apache/nifi:1.24.0
    logging: *default-logging
    container_name: niflow-cluster-n2
    profiles: ["cluster"]
    hostname: cluster-n2
    depends_on:
      cluster-zk:
        condition: service_healthy
    ports:
      - "8181:8080"
    environment: *cluster-node-env
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://$$(hostname):8080/nifi-api/flow/cluster/summary | grep -q '\"connectedToCluster\":true'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  # NiFi 1.24.0 secured with CLIENT CERTIFICATES (no username/password) —
  # mirrors a work instance doing mTLS. Opt-in via the "mtls" profile; certs
  # come from `scripts/gen-mtls-certs.sh` (make nifi-mtls-up runs it).
  # Identity: CN=niflow-client (the generated client cert) is initial admin.
  nifi-mtls:
    image: apache/nifi:1.24.0
    logging: *default-logging
    container_name: niflow-nifi-mtls
    profiles: ["mtls"]
    ports:
      - "8445:8443"
    environment:
      AUTH: "tls"
      KEYSTORE_PATH: "/opt/certs/keystore.p12"
      KEYSTORE_TYPE: "PKCS12"
      KEYSTORE_PASSWORD: "niflowpass123"
      TRUSTSTORE_PATH: "/opt/certs/truststore.p12"
      TRUSTSTORE_TYPE: "PKCS12"
      TRUSTSTORE_PASSWORD: "niflowpass123"
      INITIAL_ADMIN_IDENTITY: "CN=niflow-client"
      NIFI_WEB_PROXY_HOST: "localhost:8445"
    volumes:
      - ./certs/mtls:/opt/certs:ro
    healthcheck:
      # Authenticated probe with the client cert — proves mTLS end to end.
      # 1.x binds HTTPS to the container hostname (not localhost), and the
      # server cert's SAN is localhost, so probe by hostname with -k; strict
      # CA verification is exercised from the host by `niflow doctor`.
      test: ["CMD-SHELL", "curl -k -s -o /dev/null --cert /opt/certs/client.pem --key /opt/certs/client.key https://$$(hostname):8443/nifi-api/flow/about || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  nifi:
    image: apache/nifi:2.7.2
    logging: *default-logging
    container_name: niflow-nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      # NiFi requires the single-user password to be >= 12 characters.
      SINGLE_USER_CREDENTIALS_PASSWORD: "adminpassword123"
    volumes:
      # Mount host dirs so the GetFile/PutFile examples have somewhere to read/write.
      - ./.nifi-data/in:/in
      - ./.nifi-data/out:/out
    healthcheck:
      # NiFi binds the web server to the container hostname (not localhost), so
      # probe via $$(hostname). The endpoint returns 401 (auth required) when up,
      # so do NOT use curl -f (it fails on 401); connection-refused during boot
      # makes curl exit non-zero, keeping the container "starting"/unhealthy.
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://$$(hostname):8443/nifi-api/access/config || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # NiFi Registry paired with the default 2.7.2 line.
  registry:
    image: apache/nifi-registry:2.7.2
    logging: *default-logging
    container_name: niflow-registry
    ports:
      - "18080:18080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://$$(hostname):18080/nifi-registry-api/buckets || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
